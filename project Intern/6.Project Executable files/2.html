<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Team Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 flex flex-col min-h-screen">

    <nav class="bg-black text-white px-8 py-4 flex justify-between items-center">
        <div class="text-2xl font-bold tracking-widest">SALES</div>
        <div class="flex items-center space-x-8">
            <a href="#" class="border-b-2 border-green-500 pb-1">Home</a>

            <a href="#" class="text-gray-300 hover:text-white">Dashboard</a>
            <a href="#" class="text-gray-300 hover:text-white">Story</a>
            <a href="#" class="text-gray-300 hover:text-white">Contact</a>
            <button class="border border-green-500 text-green-500 px-4 py-2 rounded hover:bg-green-500 hover:text-black transition">
                Get Started
            </button>
        </div>
    </nav>

    <div class="bg-black h-32 w-full"></div>

    <main class="flex-grow flex flex-col items-center py-16 px-4">
        <h1 class="text-4xl font-bold text-gray-800 mb-12">Our Team</h1>

        <div class="w-full max-w-4xl bg-white rounded-lg shadow-xl overflow-hidden">
            <table class="w-full text-left border-collapse">
                <thead>
                    <tr class="bg-[#1a1a1a] text-white uppercase text-sm tracking-wider">
                        <th class="px-8 py-4 font-semibold">Role</th>

                    </tr>
                </thead>
                <tbody class="text-gray-600">
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="px-8 py-5">Team Leader</td>
                        <td class="px-8 py-5">Arja raghuveer</td>
                    </tr>
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="px-8 py-5">Team member / Developer</td>
                        <td class="px-8 py-5">Kaveti Bhavana</td>
                    </tr>
                    <tr class="border-b border-gray-100 hover:bg-gray-50 transition">
                        <td class="px-8 py-5">Team member</td>
                        <td class="px-8 py-5">Joga Balaji</td>
                    </tr>
                    <tr class="hover:bg-gray-50 transition">
                        <td class="px-8 py-5">Team member</td>
                        <td class="px-8 py-5">Kartheek</td>
                    </tr>
                </tbody>
            </table>
        </div>

    <footer class="bg-[#0a0a0a] text-gray-400 py-10 text-center text-sm">
